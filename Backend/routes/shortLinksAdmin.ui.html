<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liens courts — Scalor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --surface:#fcfcfb; --card:#ffffff; --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#8b8a86;
    --accent:#2a78d6; --accent-soft:#e8f0fb; --border:#e7e6e3; --danger:#c23b3b; --ok:#0ca30c;
  }
  *{box-sizing:border-box} body{margin:0;background:var(--surface);color:var(--ink);
    font:14px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:28px 16px 80px}
  h1{font-size:20px;margin:0 0 4px} .sub{color:var(--ink-2);margin:0 0 24px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
  label{display:block;font-size:12px;color:var(--ink-2);margin:10px 0 4px}
  input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:#fff;color:var(--ink)}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .row{display:flex;gap:12px;flex-wrap:wrap} .row>div{flex:1;min-width:180px}
  button{border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
  .btn-p{background:var(--accent);color:#fff} .btn-p:hover{filter:brightness(1.06)}
  .btn-s{background:var(--accent-soft);color:var(--accent)}
  .btn-ghost{background:transparent;color:var(--ink-2);padding:6px 10px;font-weight:500}
  .btn-ghost:hover{background:var(--accent-soft);color:var(--accent)}
  .btn-danger{color:var(--danger)} .btn-danger:hover{background:#faecec;color:var(--danger)}
  .msg{padding:10px 14px;border-radius:10px;margin:10px 0;display:none;font-size:13px}
  .msg.err{display:block;background:#faecec;color:var(--danger)}
  .msg.ok{display:block;background:#eaf6ea;color:#0a7d0a}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--ink-3);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px}
  td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .slug{font-weight:700;color:var(--accent);white-space:nowrap}
  .target{color:var(--ink-2);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .clicks{font-weight:700;text-align:right}
  .off{opacity:.45}
  .pill{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 8px}
  /* ── Stats ── */
  .heroes{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .hero{flex:1;min-width:120px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .hero b{display:block;font-size:22px} .hero span{font-size:12px;color:var(--ink-2)}
  .chart-title{font-size:12px;color:var(--ink-2);margin:18px 0 8px;font-weight:600}
  .daychart{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--border);padding-bottom:0;position:relative}
  .daybar{flex:1;min-width:3px;background:var(--accent);border-radius:4px 4px 0 0;position:relative;cursor:default}
  .daybar:hover{filter:brightness(1.15)}
  .hbar-row{display:flex;align-items:center;gap:10px;margin:6px 0}
  .hbar-label{width:110px;font-size:12px;color:var(--ink);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hbar-track{flex:1;height:14px;display:flex;align-items:center}
  .hbar-fill{height:14px;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
  .hbar-val{font-size:12px;color:var(--ink-2);min-width:34px}
  .tooltip{position:fixed;background:var(--ink);color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;pointer-events:none;display:none;z-index:50;white-space:nowrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}
  dialog{border:1px solid var(--border);border-radius:16px;padding:22px;max-width:640px;width:92%}
  dialog::backdrop{background:rgba(0,0,0,.35)}
  .qrbox{display:flex;justify-content:center;padding:14px}
  .close-x{float:right}
  .muted{color:var(--ink-3);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔗 Liens courts Scalor</h1>
  <p class="sub">Raccourcis tes liens boutique et pages produit, partage-les, mesure les clics.</p>

  <!-- Connexion compte Scalor -->
  <div class="card" id="auth-card">
    <h3 style="margin:0 0 4px">Connexion</h3>
    <p class="muted" style="margin:0 0 8px">Utilise tes identifiants Scalor (les mêmes que le dashboard).</p>
    <form id="login-form" onsubmit="login(event)">
      <div class="row">
        <div><label>Email</label><input id="login-email" type="email" autocomplete="email" placeholder="toi@exemple.com" required></div>
        <div><label>Mot de passe</label><input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
      </div>
      <div class="msg" id="login-msg"></div>
      <div style="margin-top:12px"><button class="btn-p" type="submit" id="login-btn">Se connecter</button>
        <button class="btn-ghost" type="button" onclick="toggleTokenMode()">Compte Google ? Utiliser un jeton</button></div>
    </form>
    <div id="token-form" style="display:none">
      <label>Jeton Bearer (dashboard → DevTools → Réseau → en-tête <code>Authorization</code>)</label>
      <div class="row">
        <div><input id="token" type="password" placeholder="Colle ton jeton ici"></div>
        <div style="flex:0"><button class="btn-p" onclick="saveToken()">Connecter</button></div>
      </div>
    </div>
  </div>

  <div id="app" style="display:none">
    <div style="text-align:right;margin-bottom:8px"><button class="btn-ghost" onclick="logout()">Se déconnecter</button></div>
    <!-- Création -->
    <div class="card">
      <div class="row">
        <div style="flex:2"><label>URL à raccourcir</label>
          <input id="new-url" placeholder="https://maboutique.scalor.net/produit/montre-gt-pro"></div>
        <div><label>Slug personnalisé (optionnel)</label>
          <input id="new-slug" placeholder="promo-montre"></div>
        <div><label>Titre (optionnel)</label>
          <input id="new-title" placeholder="Campagne TikTok juillet"></div>
      </div>
      <div class="msg" id="create-msg"></div>
      <div style="margin-top:12px"><button class="btn-p" onclick="createLink()">Raccourcir</button></div>
    </div>

    <!-- Liste -->
    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <div><input id="search" placeholder="Rechercher (slug, titre, URL)…" oninput="debouncedLoad()"></div>
      </div>
      <table>
        <thead><tr><th>Lien court</th><th>Destination</th><th style="text-align:right">Clics</th><th></th></tr></thead>
        <tbody id="links-body"><tr><td colspan="4" class="muted">Chargement…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Stats -->
<dialog id="stats-dialog">
  <button class="btn-ghost close-x" onclick="document.getElementById('stats-dialog').close()">✕ Fermer</button>
  <div id="stats-content"></div>
</dialog>

<!-- QR -->
<dialog id="qr-dialog">
  <button class="btn-ghost close-x" onclick="document.getElementById('qr-dialog').close()">✕ Fermer</button>
  <h3 id="qr-title" style="margin-top:0"></h3>
  <div class="qrbox"><div id="qr-target"></div></div>
  <p class="muted" style="text-align:center">Clic droit → enregistrer l'image, ou capture d'écran.</p>
</dialog>

<div class="tooltip" id="tooltip"></div>

<script>
'use strict';
const API = '/api/ecom/links';
let TOKEN = localStorage.getItem('scalor_links_token') || '';
let BASE_URL = '';
let LINKS = [];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Authorization': 'Bearer ' + TOKEN,
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    },
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 || res.status === 403) { showAuth(); throw new Error(data.message || 'Jeton invalide ou expiré'); }
  if (!res.ok) throw new Error(data.message || ('Erreur ' + res.status));
  return data;
}

function showAuth(){ $('auth-card').style.display=''; $('app').style.display='none'; }
function showApp(){ $('auth-card').style.display='none'; $('app').style.display=''; }
function toggleTokenMode(){ const t = $('token-form'); t.style.display = t.style.display === 'none' ? '' : 'none'; }

// Connexion avec le compte Scalor : POST /api/ecom/auth/login -> data.token
async function login(ev) {
  ev.preventDefault();
  const msg = $('login-msg'); msg.className = 'msg';
  const btn = $('login-btn'); btn.disabled = true; btn.textContent = 'Connexion…';
  try {
    const res = await fetch('/api/ecom/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: $('login-email').value.trim(),
        password: $('login-password').value,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data?.success || !data?.data?.token) {
      throw new Error(data?.message || 'Email ou mot de passe incorrect');
    }
    TOKEN = data.data.token;
    localStorage.setItem('scalor_links_token', TOKEN);
    $('login-password').value = '';
    await boot();
  } catch (e) {
    msg.className = 'msg err'; msg.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
}

function logout() {
  TOKEN = '';
  localStorage.removeItem('scalor_links_token');
  showAuth();
}

async function saveToken() {
  TOKEN = $('token').value.trim();
  if (!TOKEN) return;
  localStorage.setItem('scalor_links_token', TOKEN);
  await boot();
}

async function boot() {
  if (!TOKEN) return showAuth();
  try {
    const cfg = await api('/config');
    BASE_URL = cfg.data.baseUrl;
    showApp();
    await loadLinks();
  } catch (e) { /* showAuth déjà appelé si 401 */ }
}

async function loadLinks() {
  const q = encodeURIComponent($('search').value.trim());
  try {
    const res = await api('/?search=' + q);
    LINKS = res.data.links;
    renderLinks();
  } catch (e) {
    $('links-body').innerHTML = '<tr><td colspan="4" class="muted">' + esc(e.message) + '</td></tr>';
  }
}
let _t; function debouncedLoad(){ clearTimeout(_t); _t = setTimeout(loadLinks, 300); }

function renderLinks() {
  if (!LINKS.length) {
    $('links-body').innerHTML = '<tr><td colspan="4" class="muted">Aucun lien pour l\'instant — crée le premier ci-dessus.</td></tr>';
    return;
  }
  $('links-body').innerHTML = LINKS.map(l => `
    <tr class="${l.active ? '' : 'off'}">
      <td>
        <span class="slug">/${esc(l.slug)}</span> ${l.active ? '' : '<span class="pill">désactivé</span>'}<br>
        <span class="muted">${esc(l.title || '')}</span>
      </td>
      <td><a class="target" href="${esc(l.targetUrl)}" target="_blank" rel="noopener">${esc(l.targetUrl)}</a></td>
      <td class="clicks">${l.clicks || 0}</td>
      <td style="white-space:nowrap;text-align:right">
        <button class="btn-ghost" title="Copier" onclick="copyLink('${esc(l.slug)}')">📋</button>
        <button class="btn-ghost" title="Partager sur WhatsApp" onclick="shareWa('${esc(l.slug)}')">💬</button>
        <button class="btn-ghost" title="QR code" onclick="showQr('${esc(l.slug)}')">▦</button>
        <button class="btn-ghost" title="Statistiques" onclick="showStats('${esc(l.slug)}')">📊</button>
        <button class="btn-ghost" title="${l.active ? 'Désactiver' : 'Réactiver'}" onclick="toggleLink('${esc(l.slug)}', ${!l.active})">${l.active ? '⏸' : '▶'}</button>
        <button class="btn-ghost btn-danger" title="Supprimer" onclick="delLink('${esc(l.slug)}')">🗑</button>
      </td>
    </tr>`).join('');
}

async function createLink() {
  const msg = $('create-msg'); msg.className = 'msg';
  try {
    const res = await api('/', {
      method: 'POST',
      body: JSON.stringify({ url: $('new-url').value, slug: $('new-slug').value, title: $('new-title').value }),
    });
    msg.className = 'msg ok';
    msg.innerHTML = '✓ Créé : <b>' + esc(res.data.shortUrl) + '</b> — copié dans le presse-papier';
    try { await navigator.clipboard.writeText(res.data.shortUrl); } catch {}
    $('new-url').value = ''; $('new-slug').value = ''; $('new-title').value = '';
    await loadLinks();
  } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
}

function shortUrl(slug){ return BASE_URL + '/' + slug; }
async function copyLink(slug) {
  try { await navigator.clipboard.writeText(shortUrl(slug)); } catch {}
}
function shareWa(slug) {
  const u = shortUrl(slug) + '?utm_source=whatsapp';
  window.open('https://wa.me/?text=' + encodeURIComponent(u), '_blank');
}
function showQr(slug) {
  $('qr-title').textContent = shortUrl(slug);
  $('qr-target').innerHTML = '';
  if (window.QRCode) {
    new QRCode($('qr-target'), { text: shortUrl(slug), width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  } else {
    $('qr-target').textContent = 'Librairie QR non chargée (CDN inaccessible).';
  }
  $('qr-dialog').showModal();
}
async function toggleLink(slug, active) {
  try { await api('/' + slug, { method: 'PATCH', body: JSON.stringify({ active }) }); await loadLinks(); }
  catch (e) { alert(e.message); }
}
async function delLink(slug) {
  if (!confirm('Supprimer /' + slug + ' et tout son historique de clics ?')) return;
  try { await api('/' + slug, { method: 'DELETE' }); await loadLinks(); }
  catch (e) { alert(e.message); }
}

// ─── Stats ───────────────────────────────────────────────────────────────────
const tooltip = $('tooltip');
function tipShow(e, html){ tooltip.innerHTML = html; tooltip.style.display='block'; tipMove(e); }
function tipMove(e){ tooltip.style.left = (e.clientX + 12) + 'px'; tooltip.style.top = (e.clientY - 34) + 'px'; }
function tipHide(){ tooltip.style.display='none'; }

function hbars(rows, keyName) {
  const max = Math.max(...rows.map(r => r.clicks), 1);
  return rows.map(r => `
    <div class="hbar-row">
      <div class="hbar-label" title="${esc(r[keyName])}">${esc(labelize(r[keyName]))}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${Math.max(2, 100 * r.clicks / max)}%"></div></div>
      <div class="hbar-val">${r.clicks}</div>
    </div>`).join('') || '<p class="muted">Aucune donnée sur la période.</p>';
}
const COUNTRY_NAMES = { CM:'Cameroun', CI:"Côte d'Ivoire", SN:'Sénégal', FR:'France', BE:'Belgique', US:'États-Unis', GA:'Gabon', TD:'Tchad', BJ:'Bénin', TG:'Togo', NG:'Nigéria', DE:'Allemagne', CA:'Canada', GB:'Royaume-Uni', MA:'Maroc', DZ:'Algérie', '??':'Inconnu' };
const SOURCE_NAMES = { direct:'Direct / autre', whatsapp:'WhatsApp', facebook:'Facebook', instagram:'Instagram', tiktok:'TikTok', telegram:'Telegram', x:'X (Twitter)', google:'Google', youtube:'YouTube', snapchat:'Snapchat' };
const DEVICE_NAMES = { android:'Android', ios:'iPhone / iPad', desktop:'Ordinateur' };
function labelize(v){ return COUNTRY_NAMES[v] || SOURCE_NAMES[v] || DEVICE_NAMES[v] || v; }

async function showStats(slug) {
  const box = $('stats-content');
  box.innerHTML = '<p class="muted">Chargement…</p>';
  $('stats-dialog').showModal();
  let d;
  try { d = (await api('/' + slug + '/stats?days=30')).data; }
  catch (e) { box.innerHTML = '<p class="muted">' + esc(e.message) + '</p>'; return; }

  // Remplir les jours manquants pour un axe temporel honnête
  const byDayMap = Object.fromEntries(d.byDay.map(x => [x.date, x.clicks]));
  const days = [];
  for (let i = d.days - 1; i >= 0; i--) {
    const dt = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10);
    days.push({ date: dt, clicks: byDayMap[dt] || 0 });
  }
  const maxDay = Math.max(...days.map(x => x.clicks), 1);

  box.innerHTML = `
    <h3 style="margin:0 0 2px">/${esc(d.link.slug)} <span class="muted" style="font-weight:400">· ${d.days} derniers jours</span></h3>
    <p class="muted" style="margin:0 0 14px;word-break:break-all">${esc(d.link.targetUrl)}</p>
    <div class="heroes">
      <div class="hero"><b>${d.total}</b><span>clics</span></div>
      <div class="hero"><b>${d.uniques}</b><span>visiteurs uniques</span></div>
      <div class="hero"><b>${d.previews}</b><span>aperçus (bots WhatsApp/FB)</span></div>
      <div class="hero"><b>${d.allTime.clicks}</b><span>clics depuis création</span></div>
    </div>
    <div class="chart-title">Clics par jour</div>
    <div class="daychart">${days.map(x =>
      `<div class="daybar" style="height:${Math.max(2, 100 * x.clicks / maxDay)}%" data-tip="${esc(x.date)} — ${x.clicks} clic${x.clicks > 1 ? 's' : ''}"></div>`).join('')}
    </div>
    <div class="grid2">
      <div><div class="chart-title">Par source</div>${hbars(d.bySource, 'source')}</div>
      <div><div class="chart-title">Par pays</div>${hbars(d.byCountry, 'country')}</div>
      <div><div class="chart-title">Par appareil</div>${hbars(d.byDevice, 'device')}</div>
      <div><div class="chart-title">Astuce</div><p class="muted">Partage avec <code>?utm_source=tiktok</code> (ou whatsapp, facebook…) pour attribuer précisément chaque canal — le bouton 💬 le fait déjà pour WhatsApp.</p></div>
    </div>`;

  box.querySelectorAll('.daybar').forEach(el => {
    el.addEventListener('mouseenter', e => tipShow(e, el.dataset.tip));
    el.addEventListener('mousemove', tipMove);
    el.addEventListener('mouseleave', tipHide);
  });
}

if (TOKEN) { $('token').value = TOKEN; }
boot();
</script>
</body>
</html>
